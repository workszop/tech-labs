# Manually deploys the Service Agent Lab Cloudflare Worker (agent-lab-api) and applies
# its D1 migrations first (a Worker that writes `agent` usage events needs 0002_agent_runs.sql).
# Required repository secrets: CLOUDFLARE_API_TOKEN (Workers + D1 edit), CLOUDFLARE_ACCOUNT_ID.
# Before the first run, create the D1 database `agent-lab` and put its id into
# agent-lab/worker/wrangler.jsonc (replacing REPLACE_WITH_D1_ID).
# Worker secrets (CODE_PEPPER, ADMIN_TOKEN, optional PROVIDER_API_KEY) are set once with
# `wrangler secret put` and are never stored in this repository or workflow.
name: Service Agent Lab -> Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-lab/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-lab/worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Refuse to deploy without a D1 database id
        run: |
          if grep -q REPLACE_WITH_D1_ID wrangler.jsonc; then
            echo "::error::Create the D1 database 'agent-lab' and put its id into agent-lab/worker/wrangler.jsonc first."
            exit 1
          fi
      - run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
