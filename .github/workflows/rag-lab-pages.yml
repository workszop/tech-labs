# Builds RAG Lab (rag-lab/web) and publishes the site to GitHub Pages
# (custom domain https://tech-labs.warsztaty-ai.com/): the labs index (index.html)
# at the root, RAG Lab at /rag-lab/.
#
# One-time setup (repository Settings):
#   - Pages → Build and deployment → Source: "GitHub Actions"
#   - Secrets and variables → Actions → Variables → RAG_LAB_API_BASE_URL
#     = public URL of the Cloudflare Worker, e.g. https://rag-lab-api.<account>.workers.dev
#     (a *variable*, not a secret: it is embedded in public JavaScript anyway.
#      Never put provider API keys here.)
name: RAG Lab → GitHub Pages

on:
  push:
    branches: [main]
    paths: ['rag-lab/**', 'index.html', '.github/workflows/rag-lab-pages.yml']
  pull_request:
    paths: ['rag-lab/**', 'index.html', '.github/workflows/rag-lab-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rag-lab-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app — typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-lab/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rag-lab/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.RAG_LAB_API_BASE_URL }}
      - name: Assemble site (labs index at the root, RAG Lab at /rag-lab/)
        working-directory: .
        run: |
          mkdir -p _site/rag-lab
          cp index.html .nojekyll _site/
          cp -r rag-lab/web/dist/. _site/rag-lab/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  worker:
    name: Worker — typecheck and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-lab/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rag-lab/worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: [web, worker]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
